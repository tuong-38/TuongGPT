name: TuongGPT CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  lint-and-test:
    name: Kiểm tra cú pháp mã nguồn
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài đặt dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Kiểm tra lỗi cú pháp Python (Linting)
        run: |
          # Dừng build nếu có lỗi syntax hoặc undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  deploy-to-render:
    name: Kích hoạt Deploy lên Render
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"