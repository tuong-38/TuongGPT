services:
  - type: web
    name: tuonggpt-app
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: GOOGLE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
    disk:
      name: tuonggpt-storage
      mountPath: /opt/render/project/src/data
      sizeGB: 1